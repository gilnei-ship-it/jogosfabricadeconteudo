<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos da Fábrica de Conteúdos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #0d0a1a; color: #f4f0ff; font-family: 'Bricolage Grotesque', sans-serif; }
  </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">
  <div class="text-center p-8 bg-[#17122b] rounded-3xl border border-white/10 shadow-2xl max-w-md w-full relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff]"></div>
    <span class="inline-block px-3 py-1 mb-3 rounded-full bg-amber-500/10 text-[#ff6b00] border border-[#ff6b00]/30 text-xs font-bold uppercase tracking-wider">
      Jogos da Fábrica de Conteúdos
    </span>
    <h1 class="text-3xl font-extrabold mb-2 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">
      Hub de Controle
    </h1>
    <p class="text-sm text-[#9a93b8] mb-8">
      Passo 1: Abra a Arena no Computador ou TV.<br>
      Passo 2: Abra o Controle no Celular e digite o Código da Sala.
    </p>
    
    <div class="space-y-4">
      <a href="arena.html" target="_blank" class="flex items-center justify-center gap-3 w-full py-4 rounded-xl bg-[#251e42] border border-[#0055ff]/50 font-extrabold text-sm text-[#3dd6ff] shadow-lg hover:bg-[#0055ff]/20 active:scale-95 transition-all">
        <span class="text-xl">🖥️</span> ABRIR ARENA (HOST)
      </a>
      <a href="controle.html" target="_blank" class="flex items-center justify-center gap-3 w-full py-4 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff3d8b] font-extrabold text-sm text-white shadow-lg hover:brightness-110 active:scale-95 transition-all">
        <span class="text-xl">📱</span> ABRIR CONTROLE (JOGADOR)
      </a>
    </div>
  </div>
</body>
</html>
