<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle - Jogos da Fábrica de Conteúdos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca PeerJS para WebRTC P2P -->
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    :root { --bg: #0d0a1a; --card: #17122b; --text: #f4f0ff; }
    body { background: var(--bg); color: var(--text); font-family: 'Bricolage Grotesque', sans-serif; touch-action: none; user-select: none; overflow: hidden; }
    .gamepad-btn { transition: transform 0.05s ease, filter 0.1s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .gamepad-btn:active { transform: scale(0.85) !important; filter: brightness(1.3); }
    input { text-transform: uppercase; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4">

  <!-- TELA DE LOGIN E CONEXÃO -->
  <div id="screen-login" class="fixed inset-0 bg-[#0d0a1a] z-50 flex flex-col justify-center items-center p-6 text-center overflow-y-auto">
    <div class="mb-2 inline-block px-3 py-1 rounded-full bg-amber-500/10 text-[#ff6b00] border border-[#ff6b00]/30 text-xs font-bold uppercase">
      Conectar à Arena
    </div>
    <h1 class="text-3xl font-extrabold mb-1 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">
      Prepare sua Nave
    </h1>
    <p class="text-sm text-[#9a93b8] mb-6">Olhe para a tela principal e digite o Código da Sala</p>

    <div class="w-full max-w-xs space-y-4">
      <input id="input-room" type="text" placeholder="CÓDIGO DA SALA (4 LETRAS)" maxlength="4" 
             class="w-full px-4 py-4 rounded-xl bg-[#251e42] border-2 border-[#0055ff] text-white font-black text-center text-xl focus:outline-none placeholder:text-sm placeholder:font-semibold">
      
      <input id="input-name" type="text" placeholder="SEU NOME / APELIDO" maxlength="12" 
             class="w-full px-4 py-3 rounded-xl bg-[#17122b] border border-white/20 text-white font-bold text-center text-lg focus:outline-none focus:border-[#ff6b00]">

      <!-- SELEÇÃO DE MODELO -->
      <div class="grid grid-cols-3 gap-2 mt-4">
        <button onclick="selectModel('fighter', this)" class="model-btn p-3 rounded-xl bg-[#17122b] border-2 border-[#ff3d8b] flex flex-col items-center justify-center">
          <div class="text-xs font-bold text-[#ff3d8b] mb-1">Ágil</div>
          <div class="text-2xl">✈️</div>
        </button>
        <button onclick="selectModel('heavy', this)" class="model-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex flex-col items-center justify-center">
          <div class="text-xs font-bold text-[#0055ff] mb-1">Pesado</div>
          <div class="text-2xl">🚀</div>
        </button>
        <button onclick="selectModel('stealth', this)" class="model-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex flex-col items-center justify-center">
          <div class="text-xs font-bold text-[#4ade80] mb-1">Furtivo</div>
          <div class="text-2xl">🛸</div>
        </button>
      </div>

      <!-- SELEÇÃO DE COR -->
      <div class="flex justify-center gap-4 py-2">
        <button onclick="selectColor('#ff3d8b', this)" class="skin-btn w-10 h-10 rounded-full bg-[#ff3d8b] border-4 border-white shadow-[0_0_10px_#ff3d8b]"></button>
        <button onclick="selectColor('#0055ff', this)" class="skin-btn w-10 h-10 rounded-full bg-[#0055ff] border-4 border-transparent"></button>
        <button onclick="selectColor('#ff6b00', this)" class="skin-btn w-10 h-10 rounded-full bg-[#ff6b00] border-4 border-transparent"></button>
        <button onclick="selectColor('#4ade80', this)" class="skin-btn w-10 h-10 rounded-full bg-[#4ade80] border-4 border-transparent"></button>
      </div>

      <button id="btn-enter" class="w-full py-4 mt-2 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ff3d8b] text-white font-extrabold text-lg shadow-lg hover:brightness-110 active:scale-95 transition-all">
        CONECTAR AGORA ⚡
      </button>
      <div id="conn-status" class="text-sm font-bold text-[#ff3d8b] h-6"></div>
    </div>
  </div>

  <!-- TELA DO CONTROLE (GAMEPAD) -->
  <header class="flex justify-between items-center bg-[#17122b]/90 p-4 rounded-2xl border border-white/10 backdrop-blur-md">
    <div>
      <div id="p-name" class="font-black text-lg uppercase tracking-wide">PILOTO</div>
      <div id="p-status" class="text-[10px] text-[#4ade80] font-bold uppercase flex items-center gap-1">
        <div class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse"></div> Conectado à Arena
      </div>
    </div>
    <div class="flex items-center gap-5 text-right">
      <div><div class="text-[10px] text-[#9a93b8] uppercase font-bold">Pontos</div><div id="p-score" class="font-extrabold text-2xl text-[#3dd6ff]">0</div></div>
      <div><div class="text-[10px] text-[#9a93b8] uppercase font-bold">Integridade</div><div id="p-lives" class="text-lg tracking-widest text-[#ff3d8b]">❤️❤️❤️</div></div>
    </div>
  </header>

  <!-- GAMEPAD AREA -->
  <div class="flex-1 grid grid-cols-2 gap-4 items-center justify-between my-auto px-2">
    <!-- D-PAD -->
    <div class="flex justify-start items-center pl-2">
      <div class="relative w-48 h-48 bg-[#17122b] rounded-full p-2 border border-white/10 shadow-2xl flex items-center justify-center">
        <div class="absolute inset-0 rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] pointer-events-none"></div>
        <button id="btn-up" class="gamepad-btn absolute top-1 w-14 h-16 bg-[#251e42] rounded-t-2xl text-xl text-white/50 border-t border-white/10">▲</button>
        <button id="btn-down" class="gamepad-btn absolute bottom-1 w-14 h-16 bg-[#251e42] rounded-b-2xl text-xl text-white/50 border-b border-white/10">▼</button>
        <button id="btn-left" class="gamepad-btn absolute left-1 h-14 w-16 bg-[#251e42] rounded-l-2xl text-xl text-white/50 border-l border-white/10">◀</button>
        <button id="btn-right" class="gamepad-btn absolute right-1 h-14 w-16 bg-[#251e42] rounded-r-2xl text-xl text-white/50 border-r border-white/10">▶</button>
        <div class="w-12 h-12 bg-[#05030a] rounded-full border border-white/5 z-10"></div>
      </div>
    </div>
    
    <!-- ACTION BUTTONS -->
    <div class="flex justify-end items-center pr-2">
      <div class="relative w-48 h-48 rounded-full flex items-center justify-center transform rotate-12">
        <button id="btn-y" class="gamepad-btn absolute top-2 w-16 h-16 rounded-full bg-[#ff3d8b] text-white font-black text-sm border-b-4 border-black/30">Y<br><span class="text-[9px]">ULT</span></button>
        <button id="btn-a" class="gamepad-btn absolute bottom-2 w-16 h-16 rounded-full bg-[#4ade80] text-[#0d0a1a] font-black text-sm border-b-4 border-black/30">A<br><span class="text-[9px]">TIRO</span></button>
        <button id="btn-x" class="gamepad-btn absolute left-2 w-16 h-16 rounded-full bg-[#0055ff] text-white font-black text-sm border-b-4 border-black/30">X<br><span class="text-[9px]">DEF</span></button>
        <button id="btn-b" class="gamepad-btn absolute right-2 w-16 h-16 rounded-full bg-[#ff6b00] text-white font-black text-sm border-b-4 border-black/30">B<br><span class="text-[9px]">BOMB</span></button>
      </div>
    </div>
  </div>

<script>
  let player = {
    id: 'p_' + Math.random().toString(36).substr(2, 9),
    name: 'Piloto', color: '#ff3d8b', model: 'fighter',
    inputs: {}
  };

  let peer, conn;

  function selectModel(model, btn) {
    player.model = model;
    document.querySelectorAll('.model-btn').forEach(b => b.classList.replace('border-[#ff3d8b]', 'border-transparent'));
    btn.classList.replace('border-transparent', 'border-[#ff3d8b]');
  }

  function selectColor(color, btn) {
    player.color = color;
    document.querySelectorAll('.skin-btn').forEach(b => {
      b.classList.replace('border-white', 'border-transparent');
      b.style.boxShadow = 'none';
    });
    btn.classList.replace('border-transparent', 'border-white');
    btn.style.boxShadow = `0 0 10px ${color}`;
  }

  document.getElementById('btn-enter').addEventListener('click', () => {
    let roomVal = document.getElementById('input-room').value.trim().toUpperCase();
    let nameVal = document.getElementById('input-name').value.trim();
    
    if(roomVal.length !== 4) {
      document.getElementById('conn-status').textContent = 'Digite o código de 4 letras da TV.';
      return;
    }
    
    if(nameVal) player.name = nameVal;
    
    document.getElementById('conn-status').textContent = 'Conectando à sala ' + roomVal + '...';
    document.getElementById('btn-enter').disabled = true;
    document.getElementById('btn-enter').classList.add('opacity-50');

    // Inicializa WebRTC Client
    peer = new Peer();
    
    peer.on('open', () => {
      conn = peer.connect('fabrica-' + roomVal, { reliable: false });
      
      conn.on('open', () => {
        // Conectado com sucesso
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('p-name').textContent = player.name;
        document.getElementById('p-name').style.color = player.color;
        
        // Envia dados iniciais do jogador
        conn.send({ type: 'JOIN', player: player });
      });

      conn.on('data', (data) => {
        if(data.type === 'SYNC') {
          document.getElementById('p-score').textContent = data.score;
          if(data.lives <= 0) {
            document.getElementById('p-lives').textContent = 'DESTRUÍDO 💀';
            document.getElementById('p-status').innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500"></div> Game Over';
            document.getElementById('p-status').classList.replace('text-[#4ade80]', 'text-red-500');
          } else {
            document.getElementById('p-lives').textContent = '❤️'.repeat(data.lives);
          }
        }
      });

      conn.on('error', err => {
        document.getElementById('conn-status').textContent = 'Erro ao conectar. Verifique o código.';
        document.getElementById('btn-enter').disabled = false;
        document.getElementById('btn-enter').classList.remove('opacity-50');
      });
    });
  });

  // Mapeamento de Botões (Touch & Mouse)
  function bind(id, action) {
    let el = document.getElementById(id);
    let send = (state) => {
      if(player.inputs[action] === state) return; // Evita envio redundante
      player.inputs[action] = state;
      if(conn && conn.open) {
        conn.send({ type: 'INPUT', playerId: player.id, inputs: player.inputs });
      }
    };
    
    el.addEventListener('touchstart', (e)=>{e.preventDefault(); send(true);}, {passive:false});
    el.addEventListener('touchend', (e)=>{e.preventDefault(); send(false);}, {passive:false});
    el.addEventListener('mousedown', (e)=>{e.preventDefault(); send(true);});
    el.addEventListener('mouseup', (e)=>{e.preventDefault(); send(false);});
    el.addEventListener('mouseleave', (e)=>{e.preventDefault(); send(false);});
  }

  bind('btn-up', 'UP'); bind('btn-down', 'DOWN');
  bind('btn-left', 'LEFT'); bind('btn-right', 'RIGHT');
  bind('btn-a', 'SHOOT'); bind('btn-y', 'SPECIAL');
</script>
</body>
</html>
