<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle de Voo</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    :root { --bg: #0d0a1a; --text: #f4f0ff; }
    body { background: var(--bg); color: var(--text); font-family: 'Bricolage Grotesque', sans-serif; touch-action: none; user-select: none; overflow: hidden; }
    .gamepad-btn { transition: transform 0.05s ease, filter 0.1s ease, box-shadow 0.05s ease; box-shadow: 0 6px 0px rgba(0,0,0,0.6); }
    .gamepad-btn:active, .active-key { transform: translateY(4px) scale(0.95) !important; box-shadow: 0 2px 0px rgba(0,0,0,0.6) !important; filter: brightness(1.3) !important; }
    input { text-transform: uppercase; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4">

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="fixed inset-0 bg-[#0d0a1a] z-50 flex flex-col justify-center items-center p-6 text-center overflow-y-auto">
    <div class="mb-2 inline-block px-3 py-1 rounded-full bg-amber-500/10 text-[#ffb700] border border-[#ffb700]/30 text-xs font-bold uppercase">Conectar à Arena</div>
    <h1 class="text-3xl font-extrabold mb-1 bg-gradient-to-r from-[#ff6b00] via-[#ffb700] to-[#3dd6ff] bg-clip-text text-transparent">Prepare sua Nave</h1>
    <p class="text-sm text-[#9a93b8] mb-4">Olhe para a tela da TV e digite o Código da Sala</p>
    
    <div class="w-full max-w-sm space-y-4">
      <input id="input-room" type="text" placeholder="CÓDIGO (4 LETRAS)" maxlength="4" class="w-full px-4 py-4 rounded-xl bg-[#251e42] border-2 border-[#0055ff] text-white font-black text-center text-xl focus:outline-none placeholder:text-sm placeholder:font-semibold">
      <input id="input-name" type="text" placeholder="SEU NOME / APELIDO" maxlength="12" class="w-full px-4 py-3 rounded-xl bg-[#17122b] border border-white/20 text-white font-bold text-center text-lg focus:outline-none focus:border-[#ff6b00]">
      
      <div class="grid grid-cols-3 gap-2 mt-2">
        <button onclick="selectModel('fighter', this)" class="model-btn p-2 rounded-xl bg-[#17122b] border-2 border-[#ff6b00] flex flex-col items-center justify-center"><div class="text-[10px] font-bold text-[#ff6b00] mb-1">Ágil</div><div class="text-xl">✈️</div></button>
        <button onclick="selectModel('heavy', this)" class="model-btn p-2 rounded-xl bg-[#17122b] border-2 border-transparent flex flex-col items-center justify-center"><div class="text-[10px] font-bold text-[#0055ff] mb-1">Pesado</div><div class="text-xl">🚀</div></button>
        <button onclick="selectModel('stealth', this)" class="model-btn p-2 rounded-xl bg-[#17122b] border-2 border-transparent flex flex-col items-center justify-center"><div class="text-[10px] font-bold text-[#4ade80] mb-1">Furtivo</div><div class="text-xl">🛸</div></button>
      </div>

      <!-- SELETOR DAS 20 CORES DO CÍRCULO CROMÁTICO -->
      <div class="text-xs text-[#9a93b8] font-bold uppercase mt-2 mb-1">Escolha sua Cor</div>
      <div id="color-grid" class="flex flex-wrap justify-center gap-2 py-1">
        <!-- Renderizado via JS -->
      </div>

      <button id="btn-enter" class="w-full py-4 mt-2 rounded-xl bg-gradient-to-r from-[#ff6b00] to-[#ffb700] text-[#0d0a1a] font-extrabold text-lg shadow-lg hover:brightness-110 active:scale-95 transition-all">CONECTAR AGORA ⚡</button>
      <div id="conn-status" class="text-sm font-bold text-[#ffb700] h-6"></div>
      
      <!-- Aviso sobre teclado no PC -->
      <div class="text-xs text-[#9a93b8]/70 mt-2 font-semibold">
        💻 Jogando no PC? Use as setas do teclado e Espaço para atirar!
      </div>
    </div>
  </div>

  <!-- STATUS EM JOGO -->
  <header class="flex justify-between items-center bg-[#17122b]/90 p-4 rounded-2xl border border-white/10 backdrop-blur-md">
    <div>
      <div id="p-name" class="font-black text-lg uppercase tracking-wide">PILOTO</div>
      <div id="p-status" class="text-[10px] text-[#4ade80] font-bold uppercase flex items-center gap-1">
        <div class="w-2 h-2 rounded-full bg-[#4ade80] animate-pulse"></div> Conectado
      </div>
    </div>
    <div class="flex items-center gap-4 text-right">
      <div><div class="text-[10px] text-[#9a93b8] uppercase font-bold">Arma</div><div id="p-weapon" class="text-sm font-black text-[#ffb700]">LVL 1</div></div>
      <div><div class="text-[10px] text-[#9a93b8] uppercase font-bold">Pontos</div><div id="p-score" class="font-extrabold text-2xl text-[#3dd6ff]">0</div></div>
      <div><div class="text-[10px] text-[#9a93b8] uppercase font-bold">Casco</div><div id="p-lives" class="text-lg tracking-widest text-[#ffb700]">❤️❤️❤️</div></div>
    </div>
  </header>

  <!-- CONTROLES -->
  <div class="flex-1 grid grid-cols-2 gap-4 items-center justify-between my-auto px-2">
    <!-- D-PAD -->
    <div class="flex justify-start items-center pl-2">
      <div class="relative w-48 h-48 bg-[#17122b] rounded-full p-2 border border-white/10 shadow-2xl flex items-center justify-center">
        <div class="absolute inset-0 rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] pointer-events-none"></div>
        <button id="btn-up" class="gamepad-btn absolute top-1 w-14 h-16 bg-[#251e42] rounded-t-2xl text-xl text-white/50 border-t border-white/10">▲</button>
        <button id="btn-down" class="gamepad-btn absolute bottom-1 w-14 h-16 bg-[#251e42] rounded-b-2xl text-xl text-white/50 border-b border-white/10">▼</button>
        <button id="btn-left" class="gamepad-btn absolute left-1 h-14 w-16 bg-[#251e42] rounded-l-2xl text-xl text-white/50 border-l border-white/10">◀</button>
        <button id="btn-right" class="gamepad-btn absolute right-1 h-14 w-16 bg-[#251e42] rounded-r-2xl text-xl text-white/50 border-r border-white/10">▶</button>
        <div class="w-12 h-12 bg-[#05030a] rounded-full border border-white/5 z-10"></div>
      </div>
    </div>
    <!-- BOTÕES -->
    <div class="flex justify-end items-center pr-2">
      <div class="relative w-48 h-48 rounded-full flex items-center justify-center transform rotate-12">
        <button id="btn-y" class="gamepad-btn absolute top-2 w-16 h-16 rounded-full bg-[#ffb700] text-[#0d0a1a] font-black text-sm">Y<br><span class="text-[9px]">ULT</span></button>
        <button id="btn-a" class="gamepad-btn absolute bottom-2 w-16 h-16 rounded-full bg-[#4ade80] text-[#0d0a1a] font-black text-sm">A<br><span class="text-[9px]">TIRO</span></button>
        <button id="btn-x" class="gamepad-btn absolute left-2 w-16 h-16 rounded-full bg-[#0055ff] text-white font-black text-sm">X<br><span class="text-[9px]">DEF</span></button>
        <button id="btn-b" class="gamepad-btn absolute right-2 w-16 h-16 rounded-full bg-[#ff6b00] text-white font-black text-sm">B<br><span class="text-[9px]">BOMB</span></button>
      </div>
    </div>
  </div>

<script>
  const PALETTE = [
    '#FF0000', '#FF4500', '#FF8C00', '#FFA500', '#FFD700', 
    '#FFFF00', '#ADFF2F', '#32CD32', '#00FF00', '#00FA9A', 
    '#00FFFF', '#00BFFF', '#1E90FF', '#0000FF', '#8A2BE2', 
    '#9932CC', '#FF00FF', '#FF1493', '#FF69B4', '#FFFFFF'
  ];

  let player = { id: 'p_'+Math.random().toString(36).substr(2,9), name: 'Piloto', color: '#FF0000', model: 'fighter', inputs: {} };
  let peer, conn, audioCtx;

  // Renderiza a Grade de 20 Cores
  const colorGrid = document.getElementById('color-grid');
  PALETTE.forEach((color, index) => {
    let btn = document.createElement('button');
    btn.className = `skin-btn w-6 h-6 rounded-full border-2 border-transparent transition-transform`;
    btn.style.backgroundColor = color;
    if(index === 0) { btn.classList.replace('border-transparent','border-white'); btn.style.boxShadow = `0 0 8px ${color}`; }
    btn.onclick = () => selectColor(color, btn);
    colorGrid.appendChild(btn);
  });

  // Haptics e Áudios
  function vibrate(ms) { if(navigator.vibrate) navigator.vibrate(ms); }
  function playBeep(freq, type, duration) {
    if(!audioCtx) return; let osc=audioCtx.createOscillator(); osc.type=type; osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    let gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.3,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration);
  }
  function playPowerUpSound() { playBeep(400, 'sine', 0.1); setTimeout(()=>playBeep(600, 'sine', 0.1), 100); setTimeout(()=>playBeep(800, 'sine', 0.3), 200); }

  function selectModel(model, btn) { player.model=model; vibrate(15); playBeep(600,'triangle',0.1); document.querySelectorAll('.model-btn').forEach(b=>b.classList.replace('border-[#ff6b00]','border-transparent')); btn.classList.replace('border-transparent','border-[#ff6b00]'); }
  function selectColor(color, btn) { player.color=color; vibrate(15); playBeep(600,'triangle',0.1); document.querySelectorAll('.skin-btn').forEach(b=>{b.classList.replace('border-white','border-transparent');b.style.boxShadow='none'; b.style.transform='scale(1)';}); btn.classList.replace('border-transparent','border-white'); btn.style.boxShadow=`0 0 8px ${color}`; btn.style.transform='scale(1.2)'; }

  document.getElementById('btn-enter').addEventListener('click', () => {
    if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }
    vibrate(30); playBeep(800,'triangle',0.1);
    let roomVal = document.getElementById('input-room').value.trim().toUpperCase(); let nameVal = document.getElementById('input-name').value.trim();
    if(roomVal.length!==4){ document.getElementById('conn-status').textContent='Código de 4 letras inválido.'; return; }
    if(nameVal) player.name = nameVal;
    
    document.getElementById('conn-status').textContent='Conectando...'; document.getElementById('btn-enter').disabled=true; document.getElementById('btn-enter').classList.add('opacity-50');

    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect('fabrica-'+roomVal, { reliable: false });
      conn.on('open', () => {
        document.getElementById('screen-login').style.display='none'; 
        document.getElementById('p-name').textContent=player.name; 
        document.getElementById('p-name').style.color=player.color;
        conn.send({ type:'JOIN', player:player }); vibrate([50,50,50]);
      });
      conn.on('data', (data) => {
        if(data.type === 'SYNC') {
          if(data.color && data.color !== player.color) {
            player.color = data.color;
            document.getElementById('p-name').style.color = data.color;
          }
          document.getElementById('p-score').textContent = data.score;
          document.getElementById('p-weapon').textContent = 'LVL ' + (data.weaponLvl || 1);
          if(data.weaponLvl >= 4) document.getElementById('p-weapon').classList.replace('text-[#ffb700]', 'text-[#ff3d8b]');
          else document.getElementById('p-weapon').classList.replace('text-[#ff3d8b]', 'text-[#ffb700]');

          if(data.lives <= 0) {
            document.getElementById('p-lives').textContent = 'DESTRUÍDO 💀';
            document.getElementById('p-status').innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500"></div> Game Over'; document.getElementById('p-status').classList.replace('text-[#4ade80]','text-red-500');
          } else document.getElementById('p-lives').textContent = '❤️'.repeat(data.lives);
        }
        
        if(data.type === 'EVENT') {
          if(data.event === 'HIT') { vibrate([150, 50, 150]); playBeep(150, 'sawtooth', 0.4); } 
          if(data.
