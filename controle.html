<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fábrica de Conteúdos - Controle Gamepad</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0d0a1a;
      --card: #17122b;
      --text: #f4f0ff;
      --muted: #9a93b8;
      --orange: #ff6b00;
      --blue: #0055ff;
      --cyan: #3dd6ff;
      --pink: #ff3d8b;
      --green: #4ade80;
    }
    body {
      background: radial-gradient(circle at 50% 0%, rgba(255,107,0,0.15), transparent 70%), var(--bg);
      color: var(--text);
      font-family: 'Bricolage Grotesque', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .gamepad-btn {
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.1s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.2);
    }
    .gamepad-btn:active {
      transform: scale(0.90) !important;
      filter: brightness(1.3);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4">

  <!-- TELA DE LOGIN E SELEÇÃO DE AVIÃO -->
  <div id="screen-login" class="fixed inset-0 bg-[#0d0a1a] z-50 flex flex-col justify-center items-center p-6 text-center">
    <div class="mb-2 inline-block px-3 py-1 rounded-full bg-amber-500/10 text-[#ff6b00] border border-[#ff6b00]/30 text-xs font-bold uppercase tracking-wider">
      Jogos da Fábrica de Conteúdos
    </div>
    <h1 class="text-3xl font-extrabold mb-1 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">
      Controle do Piloto
    </h1>
    <p class="text-xs text-[#9a93b8] mb-6">Conecte-se para jogar na arena</p>

    <div class="w-full max-w-xs space-y-4">
      <div class="text-left">
        <label class="text-xs font-bold text-[#9a93b8] uppercase tracking-wider block mb-1">Seu Nome / Apelido</label>
        <input id="input-name" type="text" placeholder="Ex: Lider_Alpha" maxlength="12" 
               class="w-full px-4 py-3 rounded-xl bg-[#17122b] border border-[#f4f0ff]/20 text-white font-bold text-center text-lg focus:outline-none focus:border-[#ff6b00]">
      </div>

      <div class="text-left">
        <label class="text-xs font-bold text-[#9a93b8] uppercase tracking-wider block mb-1">Escolha a Cor da Nave</label>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="selectColor('#ff3d8b', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-[#ff3d8b] flex justify-center items-center">
            <div class="w-6 h-6 rounded-full bg-[#ff3d8b]"></div>
          </button>
          <button onclick="selectColor('#0055ff', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center">
            <div class="w-6 h-6 rounded-full bg-[#0055ff]"></div>
          </button>
          <button onclick="selectColor('#ff6b00', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center">
            <div class="w-6 h-6 rounded-full bg-[#ff6b00]"></div>
          </button>
          <button onclick="selectColor('#4ade80', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center">
            <div class="w-6 h-6 rounded-full bg-[#4ade80]"></div>
          </button>
        </div>
      </div>

      <button id="btn-enter" class="w-full py-4 rounded-xl bg-[#ff6b00] text-white font-extrabold text-lg shadow-lg hover:bg-[#ff8533] active:scale-95 transition-all">
        ENTRAR NA ARENA 🚀
      </button>
    </div>
  </div>

  <!-- HEADER DO CONTROLE -->
  <header class="flex justify-between items-center bg-[#17122b]/80 p-3 rounded-2xl border border-[#f4f0ff]/10 backdrop-blur-md">
    <div>
      <div id="player-disp-name" class="font-extrabold text-sm text-[#ff6b00]">PILOTO</div>
      <div id="player-disp-power" class="text-[10px] text-[#3dd6ff] font-bold uppercase">Arma: Canhão Nível 1</div>
    </div>
    <div class="flex items-center gap-4 text-right">
      <div>
        <div class="text-[9px] text-[#9a93b8] uppercase font-bold">Pontos</div>
        <div id="disp-score" class="font-extrabold text-lg leading-tight">0</div>
      </div>
      <div>
        <div class="text-[9px] text-[#9a93b8] uppercase font-bold">Vidas</div>
        <div id="disp-lives" class="text-sm tracking-widest text-[#ff3d8b]">❤️❤️❤️</div>
      </div>
    </div>
  </header>

  <!-- BARRA DO ESPECIAL -->
  <div class="my-2 bg-[#17122b] p-2 rounded-xl border border-[#f4f0ff]/10">
    <div class="flex justify-between text-[10px] font-bold mb-1">
      <span class="text-[#9a93b8]">CARGA DO ESPECIAL</span>
      <span id="special-val" class="text-[#ff3d8b]">0%</span>
    </div>
    <div class="w-full h-2.5 bg-[#0d0a1a] rounded-full overflow-hidden p-0.5 border border-[#f4f0ff]/10">
      <div id="special-bar" class="h-full bg-gradient-to-r from-[#ff3d8b] to-[#ff6b00] rounded-full w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- GAMEPAD CONTROLES (D-PAD & BOTÕES) -->
  <div class="flex-1 grid grid-cols-2 gap-4 items-center justify-center my-auto">
    <div class="flex justify-center items-center">
      <div class="relative w-44 h-44 bg-[#17122b] rounded-full p-2 border border-[#f4f0ff]/10 shadow-2xl flex items-center justify-center">
        <button id="btn-up" class="gamepad-btn absolute top-2 w-12 h-14 bg-gradient-to-b from-[#251e42] to-[#17122b] rounded-t-xl border-t border-[#f4f0ff]/20 flex items-center justify-center text-lg">▲</button>
        <button id="btn-down" class="gamepad-btn absolute bottom-2 w-12 h-14 bg-gradient-to-t from-[#251e42] to-[#17122b] rounded-b-xl border-b border-[#f4f0ff]/20 flex items-center justify-center text-lg">▼</button>
        <button id="btn-left" class="gamepad-btn absolute left-2 h-12 w-14 bg-gradient-to-r from-[#251e42] to-[#17122b] rounded-l-xl border-l border-[#f4f0ff]/20 flex items-center justify-center text-lg">◀</button>
        <button id="btn-right" class="gamepad-btn absolute right-2 h-12 w-14 bg-gradient-to-l from-[#251e42] to-[#17122b] rounded-r-xl border-r border-[#f4f0ff]/20 flex items-center justify-center text-lg">▶</button>
        <div class="w-10 h-10 bg-[#0d0a1a] rounded-full border border-[#f4f0ff]/10"></div>
      </div>
    </div>

    <div class="flex justify-center items-center">
      <div class="relative w-44 h-44 bg-[#17122b] rounded-full p-2 border border-[#f4f0ff]/10 shadow-2xl flex items-center justify-center">
        <button id="btn-y" class="gamepad-btn absolute top-2 w-12 h-12 rounded-full bg-[#ff3d8b] text-white font-extrabold text-sm border border-white/30 flex flex-col items-center justify-center shadow-lg"><span>Y</span><span class="text-[8px] opacity-80">ULT</span></button>
        <button id="btn-a" class="gamepad-btn absolute bottom-2 w-12 h-12 rounded-full bg-[#4ade80] text-[#0d0a1a] font-extrabold text-sm border border-white/30 flex flex-col items-center justify-center shadow-lg"><span>A</span><span class="text-[8px] opacity-80">TIRO</span></button>
        <button id="btn-x" class="gamepad-btn absolute left-2 w-12 h-12 rounded-full bg-[#0055ff] text-white font-extrabold text-sm border border-white/30 flex flex-col items-center justify-center shadow-lg"><span>X</span><span class="text-[8px] opacity-80">DEF</span></button>
        <button id="btn-b" class="gamepad-btn absolute right-2 w-12 h-12 rounded-full bg-[#ff6b00] text-white font-extrabold text-sm border border-white/30 flex flex-col items-center justify-center shadow-lg"><span>B</span><span class="text-[8px] opacity-80">BOMB</span></button>
      </div>
    </div>
  </div>

  <footer class="text-center text-[10px] text-[#9a93b8]">
    Conectado ao vivo com a Arena
  </footer>

<script>
  // Conexão via MQTT pública
  const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
  const TOPIC_TO_ARENA = 'fabrica_conteudos_main_game_arena';
  const TOPIC_FROM_ARENA = 'fabrica_conteudos_main_game_ctrl';

  var player = {
    id: 'p_' + Math.random().toString(36).substr(2, 9),
    name: 'Piloto',
    color: '#ff3d8b',
    score: 0,
    lives: 3,
    weaponLvl: 1,
    specialCharge: 0
  };

  client.on('connect', () => {
    client.subscribe(TOPIC_FROM_ARENA);
  });

  function selectColor(color, btn) {
    player.color = color;
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.replace('border-white', 'border-transparent'));
    btn.classList.replace('border-transparent', 'border-white');
  }

  document.getElementById('btn-enter').addEventListener('click', function() {
    var nameInput = document.getElementById('input-name').value.trim();
    if(nameInput) player.name = nameInput;
    
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('player-disp-name').textContent = player.name;
    document.getElementById('player-disp-name').style.color = player.color;

    client.publish(TOPIC_TO_ARENA, JSON.stringify({ type: 'JOIN', player: player }));
  });

  function bindBtn(id, action) {
    var el = document.getElementById(id);
    var send = (isStart) => {
      client.publish(TOPIC_TO_ARENA, JSON.stringify({
        type: isStart ? 'INPUT_START' : 'INPUT_END',
        playerId: player.id,
        action: action
      }));
    };
    el.addEventListener('touchstart', (e) => { e.preventDefault(); send(true); }, {passive: false});
    el.addEventListener('touchend', (e) => { e.preventDefault(); send(false); }, {passive: false});
    el.addEventListener('mousedown', () => send(true));
    el.addEventListener('mouseup', () => send(false));
  }

  bindBtn('btn-up', 'UP');
  bindBtn('btn-down', 'DOWN');
  bindBtn('btn-left', 'LEFT');
  bindBtn('btn-right', 'RIGHT');
  bindBtn('btn-a', 'SHOOT');
  bindBtn('btn-y', 'SPECIAL');

  client.on('message', (topic, message) => {
    try {
      var data = JSON.parse(message.toString());
      if(data.type === 'SYNC_PLAYER' && data.playerId === player.id) {
        player.score = data.score;
        player.lives = data.lives;
        player.weaponLvl = data.weaponLvl;
        player.specialCharge = data.specialCharge;

        document.getElementById('disp-score').textContent = player.score;
        document.getElementById('disp-lives').textContent = '❤️'.repeat(Math.max(0, player.lives));
        document.getElementById('player-disp-power').textContent = 'Arma: Canhão Nível ' + player.weaponLvl;
        document.getElementById('special-val').textContent = Math.floor(player.specialCharge) + '%';
        document.getElementById('special-bar').style.width = player.specialCharge + '%';
      }
    } catch(e){}
  });
</script>
</body>
</html>
