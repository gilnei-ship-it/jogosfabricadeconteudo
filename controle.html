<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle - Jogos da Fábrica de Conteúdos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg: #0d0a1a; --card: #17122b; --text: #f4f0ff; --muted: #9a93b8; --orange: #ff6b00; --pink: #ff3d8b; }
    body { background: var(--bg); color: var(--text); font-family: 'Bricolage Grotesque', sans-serif; touch-action: manipulation; user-select: none; overflow: hidden; }
    .gamepad-btn { transition: transform 0.08s ease, filter 0.1s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .gamepad-btn:active { transform: scale(0.90) !important; filter: brightness(1.3); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4">

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="fixed inset-0 bg-[#0d0a1a] z-50 flex flex-col justify-center items-center p-6 text-center">
    <div class="mb-2 inline-block px-3 py-1 rounded-full bg-amber-500/10 text-[#ff6b00] border border-[#ff6b00]/30 text-xs font-bold uppercase">
      Jogos da Fábrica de Conteúdos
    </div>
    <h1 class="text-3xl font-extrabold mb-1 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">
      Controle do Piloto
    </h1>
    <p class="text-xs text-[#9a93b8] mb-6">Insira os seus dados para entrar na Arena</p>

    <div class="w-full max-w-xs space-y-4">
      <input id="input-name" type="text" placeholder="Seu Nome / Apelido" maxlength="12" 
             class="w-full px-4 py-3 rounded-xl bg-[#17122b] border border-white/20 text-white font-bold text-center text-lg focus:outline-none focus:border-[#ff6b00]">

      <div class="grid grid-cols-4 gap-2">
        <button onclick="selectColor('#ff3d8b', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-[#ff3d8b] flex justify-center items-center"><div class="w-6 h-6 rounded-full bg-[#ff3d8b]"></div></button>
        <button onclick="selectColor('#0055ff', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center"><div class="w-6 h-6 rounded-full bg-[#0055ff]"></div></button>
        <button onclick="selectColor('#ff6b00', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center"><div class="w-6 h-6 rounded-full bg-[#ff6b00]"></div></button>
        <button onclick="selectColor('#4ade80', this)" class="skin-btn p-3 rounded-xl bg-[#17122b] border-2 border-transparent flex justify-center items-center"><div class="w-6 h-6 rounded-full bg-[#4ade80]"></div></button>
      </div>

      <button id="btn-enter" class="w-full py-4 rounded-xl bg-[#ff6b00] text-white font-extrabold text-lg shadow-lg hover:bg-[#ff8533] active:scale-95 transition-all">
        DECOLAR 🚀
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="flex justify-between items-center bg-[#17122b]/80 p-3 rounded-2xl border border-white/10 backdrop-blur-md">
    <div>
      <div id="p-name" class="font-extrabold text-sm text-[#ff6b00]">PILOTO</div>
      <div id="p-weapon" class="text-[10px] text-[#3dd6ff] font-bold uppercase">Canhão Nível 1</div>
    </div>
    <div class="flex items-center gap-4 text-right">
      <div><div class="text-[9px] text-[#9a93b8] uppercase font-bold">Pontos</div><div id="p-score" class="font-extrabold text-lg">0</div></div>
      <div><div class="text-[9px] text-[#9a93b8] uppercase font-bold">Vidas</div><div id="p-lives" class="text-sm tracking-widest text-[#ff3d8b]">❤️❤️❤️</div></div>
    </div>
  </header>

  <!-- GAMEPAD -->
  <div class="flex-1 grid grid-cols-2 gap-4 items-center justify-center my-auto">
    <div class="flex justify-center items-center">
      <div class="relative w-44 h-44 bg-[#17122b] rounded-full p-2 border border-white/10 shadow-2xl flex items-center justify-center">
        <button id="btn-up" class="gamepad-btn absolute top-2 w-12 h-14 bg-[#251e42] rounded-t-xl text-lg">▲</button>
        <button id="btn-down" class="gamepad-btn absolute bottom-2 w-12 h-14 bg-[#251e42] rounded-b-xl text-lg">▼</button>
        <button id="btn-left" class="gamepad-btn absolute left-2 h-12 w-14 bg-[#251e42] rounded-l-xl text-lg">◀</button>
        <button id="btn-right" class="gamepad-btn absolute right-2 h-12 w-14 bg-[#251e42] rounded-r-xl text-lg">▶</button>
        <div class="w-10 h-10 bg-[#0d0a1a] rounded-full"></div>
      </div>
    </div>
    <div class="flex justify-center items-center">
      <div class="relative w-44 h-44 bg-[#17122b] rounded-full p-2 border border-white/10 shadow-2xl flex items-center justify-center">
        <button id="btn-y" class="gamepad-btn absolute top-2 w-12 h-12 rounded-full bg-[#ff3d8b] text-white font-extrabold text-xs">Y<br>ULT</button>
        <button id="btn-a" class="gamepad-btn absolute bottom-2 w-12 h-12 rounded-full bg-[#4ade80] text-[#0d0a1a] font-extrabold text-xs">A<br>TIRO</button>
        <button id="btn-x" class="gamepad-btn absolute left-2 w-12 h-12 rounded-full bg-[#0055ff] text-white font-extrabold text-xs">X<br>DEF</button>
        <button id="btn-b" class="gamepad-btn absolute right-2 w-12 h-12 rounded-full bg-[#ff6b00] text-white font-extrabold text-xs">B<br>BOMB</button>
      </div>
    </div>
  </div>

<script>
  const channel = new BroadcastChannel('fabrica_conteudos_channel_v2');
  let player = {
    id: 'p_' + Math.random().toString(36).substr(2, 9),
    name: 'Piloto',
    color: '#ff3d8b',
    score: 0,
    lives: 3,
    weaponLvl: 1,
    x: 100, y: 400,
    inputs: {}
  };

  function selectColor(color, btn) {
    player.color = color;
    document.querySelectorAll('.skin-btn').forEach(b => b.classList.replace('border-white', 'border-transparent'));
    btn.classList.replace('border-transparent', 'border-white');
  }

  document.getElementById('btn-enter').addEventListener('click', () => {
    let nameVal = document.getElementById('input-name').value.trim();
    if(nameVal) player.name = nameVal;
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('p-name').textContent = player.name;
    document.getElementById('p-name').style.color = player.color;
    
    channel.postMessage({ type: 'JOIN', player: player });
  });

  function bind(id, action) {
    let el = document.getElementById(id);
    let send = (state) => {
      player.inputs[action] = state;
      channel.postMessage({ type: 'INPUT', playerId: player.id, inputs: player.inputs, player: player });
    };
    el.addEventListener('touchstart', (e)=>{e.preventDefault(); send(true);}, {passive:false});
    el.addEventListener('touchend', (e)=>{e.preventDefault(); send(false);}, {passive:false});
    el.addEventListener('mousedown', ()=>send(true));
    el.addEventListener('mouseup', ()=>send(false));
  }

  bind('btn-up', 'UP'); bind('btn-down', 'DOWN');
  bind('btn-left', 'LEFT'); bind('btn-right', 'RIGHT');
  bind('btn-a', 'SHOOT'); bind('btn-y', 'SPECIAL');

  channel.onmessage = (e) => {
    if(e.data.type === 'SYNC' && e.data.playerId === player.id) {
      player.score = e.data.score;
      player.lives = e.data.lives;
      player.weaponLvl = e.data.weaponLvl;
      document.getElementById('p-score').textContent = player.score;
      document.getElementById('p-lives').textContent = '❤️'.repeat(Math.max(0, player.lives));
      document.getElementById('p-weapon').textContent = 'Canhão Nível ' + player.weaponLvl;
    }
  };
</script>
</body>
</html>
