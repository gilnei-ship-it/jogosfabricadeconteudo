<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Principal - Jogos da Fábrica de Conteúdos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0d0a1a; color: #f4f0ff; font-family: 'Bricolage Grotesque', sans-serif; margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 relative">

  <header class="flex justify-between items-center bg-[#17122b]/90 px-6 py-3 rounded-2xl border border-white/10 backdrop-blur-md z-10">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-[#ff6b00] animate-ping"></div>
      <div>
        <h1 class="text-xl font-extrabold bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">
          FÁBRICA DE CONTEÚDOS · ARENA MULTIPLAYER
        </h1>
        <p class="text-xs text-[#9a93b8]">Desafios de Liderança e Desenvolvimento Humano</p>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right"><div class="text-[10px] text-[#9a93b8] font-bold uppercase">Pilotos</div><div id="conn-count" class="text-2xl font-extrabold text-[#3dd6ff]">0 / 20</div></div>
      <button id="btn-finish" class="px-5 py-2.5 rounded-xl bg-[#ff3d8b] hover:bg-[#ff5d7a] font-extrabold text-sm shadow-lg">VER TOP 3 🏆</button>
    </div>
  </header>

  <main class="flex-1 my-3 relative rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-[#0a0716]">
    <canvas id="arena-canvas" class="w-full h-full"></canvas>

    <div id="podium-modal" class="hidden absolute inset-0 bg-[#0d0a1a]/95 z-50 flex flex-col items-center justify-center p-6 text-center">
      <h2 class="text-4xl font-extrabold mb-2 bg-gradient-to-r from-[#ff6b00] via-[#ff3d8b] to-[#3dd6ff] bg-clip-text text-transparent">🏆 PÓDIO DOS CAMPEÕES 🏆</h2>
      <div id="podium-list" class="flex justify-center items-end gap-6 mb-8 w-full max-w-2xl"></div>
      <button onclick="location.reload()" class="px-8 py-3.5 rounded-xl bg-[#ff6b00] font-extrabold text-lg">REINICIAR</button>
    </div>
  </main>

<script>
  const canvas = document.getElementById('arena-canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() { W = canvas.width = canvas.parentElement.clientWidth; H = canvas.height = canvas.parentElement.clientHeight; }
  window.addEventListener('resize', resize);
  resize();

  const channel = new BroadcastChannel('fabrica_conteudos_channel_v2');
  let players = {};
  let bullets = [], enemies = [];

  const TARGETS = [
    { title: 'Microgerenciamento', hp: 3, pts: 30, color: '#ff3d8b' },
    { title: 'Falta de Feedback', hp: 2, pts: 20, color: '#ff3d8b' },
    { title: 'Silos Organizacionais', hp: 4, pts: 40, color: '#0055ff' },
    { title: 'Processos Engessados', hp: 3, pts: 30, color: '#0055ff' },
    { title: 'Dívida Técnica', hp: 2, pts: 25, color: '#ff6b00' },
    { title: 'Churn de Clientes', hp: 5, pts: 50, color: '#ff6b00' }
  ];

  channel.onmessage = (e) => {
    let data = e.data;
    if(data.type === 'JOIN' || data.type === 'INPUT') {
      if(!players[data.player.id]) {
        players[data.player.id] = {
          ...data.player,
          x: W / 2 + (Math.random() * 100 - 50),
          y: H - 100,
          inputs: data.inputs || {}
        };
      } else {
        players[data.player.id].inputs = data.inputs || players[data.player.id].inputs;
      }
      document.getElementById('conn-count').textContent = Object.keys(players).length + ' / 20';
    }
  };

  setInterval(() => {
    if(enemies.length < 10) {
      let t = TARGETS[Math.floor(Math.random() * TARGETS.length)];
      enemies.push({ x: Math.random() * (W - 120) + 60, y: -40, vy: 1.2, ...t });
    }
  }, 2000);

  function update() {
    Object.keys(players).forEach(id => {
      let p = players[id];
      let spd = 6;
      if(p.inputs['LEFT']) p.x = Math.max(30, p.x - spd);
      if(p.inputs['RIGHT']) p.x = Math.min(W - 30, p.x + spd);
      if(p.inputs['UP']) p.y = Math.max(30, p.y - spd);
      if(p.inputs['DOWN']) p.y = Math.min(H - 30, p.y + spd);

      if(p.inputs['SHOOT']) {
        if(!p.lastShoot || Date.now() - p.lastShoot > 200) {
          p.lastShoot = Date.now();
          bullets.push({ x: p.x, y: p.y - 20, vy: -12, color: p.color, ownerId: p.id });
        }
      }

      channel.postMessage({ type: 'SYNC', playerId: p.id, score: p.score, lives: p.lives, weaponLvl: p.weaponLvl });
    });

    for(let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y += b.vy;
      if(b.y < -10) { bullets.splice(i, 1); continue; }
      for(let j = enemies.length - 1; j >= 0; j--) {
        let e = enemies[j];
        if(Math.abs(b.x - e.x) < 45 && Math.abs(b.y - e.y) < 25) {
          e.hp--;
          bullets.splice(i, 1);
          if(e.hp <= 0) {
            if(players[b.ownerId]) players[b.ownerId].score += e.pts;
            enemies.splice(j, 1);
          }
          break;
        }
      }
    }

    for(let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.vy;
      if(e.y > H + 30) { enemies.splice(i, 1); continue; }
      Object.keys(players).forEach(id => {
        let p = players[id];
        if(Math.abs(e.x - p.x) < 30 && Math.abs(e.y - p.y) < 30) {
          p.lives--;
          enemies.splice(i, 1);
        }
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    
    enemies.forEach(e => {
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.roundRect(e.x - 55, e.y - 18, 110, 36, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(e.title, e.x, e.y + 4);
    });

    bullets.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - 2, b.y - 8, 4, 16);
    });

    Object.keys(players).forEach(id => {
      let p = players[id];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p.name, 0, -28);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(16, 14); ctx.lineTo(-16, 14); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();

  document.getElementById('btn-finish').addEventListener('click', () => {
    let list = document.getElementById('podium-list');
    list.innerHTML = '';
    let sorted = Object.values(players).sort((a,b) => b.score - a.score).slice(0, 3);
    sorted.forEach(p => {
      let card = document.createElement('div');
      card.className = 'flex-1 bg-[#17122b] p-4 rounded-2xl border border-white/10 flex flex-col justify-end items-center h-36';
      card.innerHTML = `<div class="font-extrabold text-lg" style="color:${p.color}">${p.name}</div><div class="text-2xl font-black text-[#3dd6ff]">${p.score} pts</div>`;
      list.appendChild(card);
    });
    document.getElementById('podium-modal').classList.remove('hidden');
  });
</script>
</body>
</html>
